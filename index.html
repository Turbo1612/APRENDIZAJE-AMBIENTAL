<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EcoLey Perú - Entrenador Ambiental</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background-color: #f0fdf4; color: #1e293b; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.08); }
    header { background: #16a34a; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    .stats { display: flex; gap: 8px; font-size: 0.85rem; background: rgba(0,0,0,0.18); padding: 5px 10px; border-radius: 20px; align-items: center; }
    .nav-tabs { display: flex; background: #f1f5f9; border-bottom: 2px solid #e2e8f0; }
    .tab-btn { flex: 1; padding: 12px 6px; border: none; background: none; font-weight: 700; font-size: 0.82rem; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #16a34a; border-bottom-color: #16a34a; background: white; }
    .content { padding: 16px; flex: 1; }
    .card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 15px; margin-bottom: 14px; }
    .badge { display: inline-block; background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 6px; }
    .badge-warn { background: #fef3c7; color: #b45309; }
    .badge-ai { background: #f3e8ff; color: #7e22ce; }
    h2 { margin: 4px 0 8px 0; font-size: 1.15rem; color: #0f172a; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 0.92rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn:disabled { background: #cbd5e1; color: #64748b; box-shadow: none; cursor: not-allowed; }
    .btn-primary { background: #16a34a; color: white; box-shadow: 0 4px 0 #15803d; }
    .btn-secondary { background: #0284c7; color: white; box-shadow: 0 4px 0 #0369a1; }
    .btn-ai { background: #7e22ce; color: white; box-shadow: 0 4px 0 #581c87; }
    .btn-warning { background: #ea580c; color: white; box-shadow: 0 4px 0 #c2410c; }
    .option-btn { width: 100%; text-align: left; padding: 13px; margin-bottom: 9px; border: 2px solid #cbd5e1; border-radius: 12px; background: white; font-size: 0.92rem; font-weight: 500; cursor: pointer; line-height: 1.35; }
    .option-btn.correct { background: #dcfce7; border-color: #16a34a; color: #14532d; font-weight: 700; }
    .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
    .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; background: #22c55e; width: 0%; transition: width 0.3s; }
    .feedback-box { padding: 13px; border-radius: 12px; margin-top: 12px; font-size: 0.88rem; line-height: 1.45; display: none; }
    .feedback-ok { background: #dcfce7; border: 1px solid #16a34a; color: #14532d; }
    .feedback-err { background: #fee2e2; border: 1px solid #ef4444; color: #7f1d1d; }
    .law-item { border-left: 4px solid #16a34a; padding-left: 12px; margin-bottom: 12px; }
    .input-box { width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 0.9rem; margin-top: 6px; margin-bottom: 10px; }
    .check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
    .check-item input { transform: scale(1.3); margin-top: 3px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div>🌿 EcoLey <span id="net-status" style="font-size:0.75rem; font-weight:normal;">🟢 Online</span></div>
      <div class="stats">
        <span id="streak-display">🔥 0</span>
        <span id="lives-display">❤️ 5</span>
        <span id="xp-display">⚡ 0</span>
      </div>
    </header>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-estudio" onclick="cambiarTab('estudio')">📚 Módulos</button>
      <button class="tab-btn" id="tab-ia" onclick="cambiarTab('ia')">✨ Actualizar IA</button>
      <button class="tab-btn" id="tab-check" onclick="cambiarTab('check')">📋 Fiscalización</button>
    </div>
    <div class="content" id="main-content">
      <p>Sincronizando normativa...</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
