<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EcoLey Perú - Entrenador Ambiental</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background-color: #f0fdf4; color: #1e293b; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.08); }
    header { background: #16a34a; color: white; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    .stats { display: flex; gap: 12px; font-size: 0.95rem; }
    .content { padding: 18px; flex: 1; }
    .card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .badge { display: inline-block; background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; }
    h2 { margin: 6px 0 12px 0; font-size: 1.25rem; color: #0f172a; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #16a34a; color: white; box-shadow: 0 4px 0 #15803d; }
    .btn-secondary { background: #0284c7; color: white; box-shadow: 0 4px 0 #0369a1; }
    .option-btn { width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; border: 2px solid #cbd5e1; border-radius: 12px; background: white; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
    .option-btn.correct { background: #dcfce7; border-color: #16a34a; color: #14532d; font-weight: 700; }
    .option-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #7f1d1d; }
    .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
    .progress-fill { height: 100%; background: #22c55e; width: 0%; transition: width 0.3s; }
    .feedback-box { padding: 14px; border-radius: 12px; margin-top: 14px; font-size: 0.9rem; line-height: 1.4; display: none; }
    .feedback-ok { background: #dcfce7; border: 1px solid #16a34a; color: #14532d; }
    .feedback-err { background: #fee2e2; border: 1px solid #ef4444; color: #7f1d1d; }
    .law-item { border-left: 4px solid #16a34a; padding-left: 12px; margin-bottom: 14px; }
    .law-item h4 { margin: 0 0 4px 0; color: #15803d; }
    .law-item p { margin: 2px 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div>🌿 EcoLey Perú</div>
      <div class="stats">
        <span id="xp-display">⚡ 0 XP</span>
      </div>
    </header>
    <div class="content" id="main-content">
      <p>Cargando normativa...</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
